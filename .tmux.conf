# color
set -g default-terminal "tmux"

# panes
unbind '"'
unbind %
bind -r s split-window -v
bind -r C-s split-window -v
bind -r v split-window -h
bind -r C-v split-window -h
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

set -g pane-active-border-style bg=color0,fg=color4
set -g pane-border-style bg=color0,fg=color0
set -g pane-border-lines double

# Vim-esque bindings
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# start numbering at 1
set -g base-index 1

# change window
bind -r C-c new-window
bind -r C-b next-window
bind -r C-n last-window

# reload config
bind r source-file ~/.tmux.conf

# Redraw
bind C-r refresh-client

# new windows
bind C-t new-window -n 'Tmux Config' "sh -c 'vim ~/.tmux.conf && tmux source ~/.tmux.conf'"
bind C-y new-window -n 'Nix Config' "bash -c 'EDITOR=vim sudoedit /etc/nixos/configuration.nix'"
bind C-p new-window -n 'Nix Config' "bash -c 'EDITOR=vim sudoedit /etc/nixos/home.nix'"
bind M command-prompt -p "Program:" "new-window -n 'man %1' 'man %1'"

# status bar
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 150
set -g status-style bg=color0,fg=color7

set -g status-left "#[bg=color4]#{?client_prefix,#[bg=color3],} ❐ #S "
set -g status-right "#[bg=color6]#{?client_prefix,#[bg=color3],} %I:%M %p \
#[bg=color4]#{?client_prefix,#[bg=color1],} %a %D "

set -g window-status-format " #I: #W "
set -g window-status-current-format "#[bg=color3]#{?client_prefix,#[bg=color4],} #I: #W "
